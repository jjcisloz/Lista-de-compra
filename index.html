<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La compra</title>
<meta name="description" content="Lista de la compra compartida para toda la familia, con avisos de lo que se acaba y control de caducidades.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161F35" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La compra">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="top" id="topBar">
  <div class="wrap">
    <div class="brand">
      <h1 id="homeName">La compra</h1>
      <div class="head-actions">
        <button class="people-btn" id="peopleBtn" type="button">Somos <span id="peopleN">…</span></button>
        <button class="gear" id="gearBtn" type="button" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
    <div class="adder">
      <label for="addInput" class="sr">Añadir a la lista</label>
      <input id="addInput" type="text" autocomplete="off" enterkeyhint="done" placeholder="Leche, 2 barras de pan, huevos…">
      <button class="icon-btn" id="micBtn" type="button" hidden aria-label="Dictar productos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="btn btn-primary" id="addBtn" type="button">Añadir</button>
      <div class="ac" id="ac" hidden></div>
    </div>
    <nav class="tabs" aria-label="Secciones">
      <a href="#lista" data-view="lista">Lista<span class="count" id="cList"></span></a>
      <a href="#despensa" data-view="despensa">Despensa<span class="count" id="cPantry"></span></a>
      <a href="#historial" data-view="historial">Historial</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="v-setup" hidden></section>
  <section id="v-lista" aria-label="Lista de la compra"></section>
  <section id="v-despensa" aria-label="Despensa" hidden></section>
  <section id="v-historial" aria-label="Historial" hidden></section>
</main>

<div class="checkout" id="checkout" hidden>
  <button class="btn" id="checkoutBtn" type="button">Terminar compra</button>
</div>
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastAct" type="button" hidden></button></div>

<script src="./config.js"></script>
<script src="./dateparse.js"></script>
<script src="./app.js"></script>
</body>
</html>
