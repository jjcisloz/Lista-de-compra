# Crea el APK de Android cada vez que subes cambios al repositorio.
# El APK aparece en la pestaña «Releases» del repositorio (y en «Actions» › la ejecución › Artifacts).
name: APK Android

on:
  push:
    branches: [main, master]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TIENE_FIRMA: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar la web que va dentro de la app
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p www/vendor
          cp index.html styles.css app.js dateparse.js config.js manifest.webmanifest www/
          cp -r icons www/
          # Firebase va dentro del APK para que la app abra aunque no haya cobertura
          for f in app auth firestore; do
            curl -fsSL -o "www/vendor/firebase-$f-compat.js" "https://www.gstatic.com/firebasejs/10.12.2/firebase-$f-compat.js"
          done
          # Dirección web de la app, para los enlaces de invitación que se mandan desde el móvil
          echo "window.APP_CONFIG.webUrl = window.APP_CONFIG.webUrl || 'https://${OWNER,,}.github.io/${REPO}/';" >> www/config.js

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Poner el icono y la pantalla de inicio
        run: |
          find android/app/src/main/res -name 'splash.png' -delete
          cp -r android-res/. android/app/src/main/res/

      - name: Número de versión
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Configurar la firma
        if: env.TIENE_FIRMA == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Compilar el APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          if [ "$TIENE_FIRMA" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../la-compra.apk
          else
            echo "::warning::Sin llave de firma: se crea un APK de pruebas. Para poder actualizar la app sin desinstalarla, añade los secretos del README."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../la-compra.apk
          fi

      - name: Guardar el APK en esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: la-compra-apk
          path: la-compra.apk

      - name: Publicar el APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.${{ github.run_number }}"
          gh release create "$TAG" la-compra.apk \
            --title "La compra $TAG" \
            --notes "Descarga **la-compra.apk** en el móvil Android y ábrelo para instalarlo." \
            --latest
